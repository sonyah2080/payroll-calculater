<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>급여 일할 계산기</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M19 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 16H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V6h10v4z'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 자바스크립트가 자동으로 헤더 탭을 그려주는 영역 -->
    <header id="mainHeader"></header>

    <!-- 일할 계산기 메인 카드 -->
    <main class="card">
      <div class="header">
        <h1>급여 일할 계산기</h1>
        <p>근무기간에 따른 월급 일할 계산 및 4대보험 공제 반영</p>
      </div>

      <form id="proratedForm">
        <div class="form-group">
          <label for="proBaseSalary">월 기본 급여 (원)</label>
          <input type="text" id="proBaseSalary" value="3,000,000" inputmode="numeric">
        </div>

        <div class="form-group">
          <label for="proTaxFree">비과세 수당 (식대 등) (원)</label>
          <input type="text" id="proTaxFree" value="200,000" inputmode="numeric">
        </div>

      <!-- 근무 기간 영역 (기준년월 선택 + 8자리 연속 입력) -->
        <div class="form-group">
          <label for="proTargetMonth">계산 기준년월</label>
          <input type="month" id="proTargetMonth">
        </div>

        <div class="form-group">
          <label>실제 근무 기간 (숫자 8자리 연달아 입력 가능)</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" id="proStartDate" placeholder="20260801" maxlength="10">
            <span>~</span>
            <input type="text" id="proEndDate" placeholder="20260831" maxlength="10">
          </div>
        </div>
        <div class="form-group">
          <label for="proCalcType">계산 방식 선택</label>
          <select id="proCalcType">
            <option value="TOTAL_DAYS">월 총 일수 기준 (해당 월 달력 일수 28~31일)</option>
            <option value="FIXED_209">월 209시간/고정 소정일수 기준</option>
          </select>
        </div>

        <span class="checkbox-group-title">공제 항목 선택</span>
        <div class="checkbox-group">
          <label class="checkbox-label"><input type="checkbox" id="proChkNp" checked> 국민연금</label>
          <label class="checkbox-label"><input type="checkbox" id="proChkHi" checked> 건강보험</label>
          <label class="checkbox-label"><input type="checkbox" id="proChkEi" checked> 고용보험</label>
          <label class="checkbox-label"><input type="checkbox" id="proChkTax" checked> 소득세</label>
        </div>

        <button type="button" id="btnProratedCalc" class="btn-primary">일할 급여 계산하기</button>
      </form>

      <!-- 2번 이미지 형태의 상세 계산 결과 영역 -->
      <div class="result-section" id="proResultBox">
        <div class="summary-card">
          <div class="summary-row main">
            <span>일할 세전 급여</span>
            <span id="resProGross" style="font-size: 20px; font-weight: 800; color: #1e3a8a;">0 원</span>
          </div>
        </div>

        <div class="detail-box">
          <div class="detail-title">공제 항목별 상세 내역 (10원 단위 절사)</div>
          <ul class="detail-list">
            <li class="detail-item"><span>국민연금 (4.5%)</span><span class="amount" id="resProNp">0 원</span></li>
            <li class="detail-item"><span>건강보험 (3.545%)</span><span class="amount" id="resProHi">0 원</span></li>
            <li class="detail-item"><span>고용보험 (0.9%)</span><span class="amount" id="resProEi">0 원</span></li>
            <li class="detail-item"><span>장기요양보험 (12.95%)</span><span class="amount" id="resProLt">0 원</span></li>
            <li class="detail-item"><span>소득세 (간이세액)</span><span class="amount" id="resProIt">0 원</span></li>
            <li class="detail-item"><span>지방소득세 (10%)</span><span class="amount" id="resProLtTax">0 원</span></li>
          </ul>

          <div class="total-deduction-row">
            <span>총 공제 합계</span>
            <span id="resProTotalDeduction">0 원</span>
          </div>

          <div class="net-result-box">
            <span>예상 실수령액 (차인지급액)</span>
            <span id="resProNet" style="color: #2563eb;">0 원</span>
          </div>
        </div>
      </div>

      <div class="footer">
        Copyright © 2026 wayer. All rights reserved.
      </div>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="prorated.js"></script>
</body>
</html>
