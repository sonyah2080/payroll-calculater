<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>급여 일할 계산기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 공통 헤더 탭 자동 삽입 위치 -->
    <header id="mainHeader"></header>

    <!-- 일할 계산기 카드 본문 -->
    <main class="card">
      <div class="card-header">
        <h2>🗓️ 중도 입·퇴사자 급여 일할계산</h2>
        <p>근무기간에 따른 월급 일할 계산 및 세무대리용 산식 적용</p>
      </div>

      <form id="proratedForm">
        <div class="input-group">
          <label for="proBaseSalary">월 기본 급여 (원)</label>
          <input type="text" id="proBaseSalary" placeholder="0" class="input-text">
        </div>

        <div class="input-group">
          <label for="proStartDate">근무 기간</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="date" id="proStartDate" class="input-date">
            <span>~</span>
            <input type="date" id="proEndDate" class="input-date">
          </div>
        </div>

        <div class="input-group">
          <label for="proCalcType">계산 방식 선택</label>
          <select id="proCalcType" class="input-select">
            <option value="TOTAL_DAYS">월 총 일수 기준 (해당 월 달력 일수 28~31일)</option>
            <option value="FIXED_209">월 209시간/고정 소정일수 기준</option>
          </select>
        </div>

        <button type="button" id="btnProratedCalc" class="btn-primary">일할 급여 계산하기</button>
      </form>

      <!-- 결과 출력 영역 -->
      <div id="proResultBox" class="result-box" style="display: none; margin-top: 20px;">
        <div class="highlight-box">
          <span class="title">최종 일할 계산 급여액</span>
          <span class="amount" id="proResultAmount">0 원</span>
        </div>
      </div>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="prorated.js"></script>
</body>
</html>
