<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업소득(3.3%) 계산기</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M19 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 16H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V6h10v4z'/></svg>">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/calculator.css">
</head>

<body>
  <div class="container">
    <header id="mainHeader"></header>

    <main class="card">
      <div class="header">
        <h1>사업소득 계산기</h1>
        <p>프리랜서, 알바 등 3.3% 원천징수 세금 계산기</p>
      </div>

      <!-- 💡 요청하신 탭 구조 반영 -->
      <div class="tab-group">
        <button type="button" class="tab-btn active" data-mode="GROSS_TO_NET">지급 계산기</button>
        <button type="button" class="tab-btn" data-mode="NET_TO_GROSS">역산 계산기</button>
      </div>

      <form id="businessForm" onsubmit="return false;">
        <div class="form-group">
          <label id="amountLabel" for="amount">총 지급액 (세전) (원)</label>
          <div class="input-wrapper">
            <input type="text" id="amount" value="3,000,000" inputmode="numeric" placeholder="세전 금액 입력">
            <button type="button" id="btnClearAmount" class="btn-clear" aria-label="금액 지우기">✕</button>
          </div>
        </div>

        <div class="result-section show" id="resultBox">
          <div class="summary-card">
            <div class="summary-row main">
              <span id="resMainTitle">실 지급액 (차인지급액)</span>
              <span id="resMainAmount" style="color: var(--blue-500);">0 원</span>
            </div>
            <div class="summary-row" style="margin-top: 10px; font-size: 14px; color: var(--bluescale-700);">
              <span id="resSubTitle">기준 총 지급액 (세전)</span>
              <span id="resSubAmount">0 원</span>
            </div>
          </div>

          <div class="detail-box">
            <div class="detail-title">원천징수 상세 내역 (10원 단위 절사)</div>
            <ul class="detail-list">
              <li class="detail-item">
                <span>사업소득세 (3%)</span>
                <span class="amount" id="resIncomeTax">0 원</span>
              </li>
              <li class="detail-item">
                <span>지방소득세 (0.3%)</span>
                <span class="amount" id="resLocalTax">0 원</span>
              </li>
              <li class="detail-item total" style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--bluescale-300);">
                <span style="font-weight: 700; color: var(--blue-600);">총 공제 세액 합계</span>
                <span class="amount" id="resTotalTax" style="font-weight: 700; color: var(--blue-600);">0 원</span>
              </li>
            </ul>
          </div>
        </div>
      </form>
    </main>
  </div>
  <div id="mainFooter"></div>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/freelancer.js"></script>
</body>

</html>
